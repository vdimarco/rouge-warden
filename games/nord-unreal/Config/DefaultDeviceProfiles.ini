; NordPhoneStream: the opt-in phone-stream profile of the NORD mobile gauntlet (openspec/changes/nord-mobile-gauntlet).
; NORD_STREAM_QUALITY=phone in Scripts/browser_streaming.py selects it with -DeviceProfile=NordPhoneStream.
; The first version equals QUALITY in Scripts/browser_streaming.py, so choosing it changes nothing on screen.
; Only 'gauntlet_loop.py write-profile --approved' rewrites the CVars, after the user approves paired captures.
; The section layout and the -DeviceProfile= override are written from memory of the engine (unverified until
; the host reads every CVar back in the Browser package).
[DeviceProfiles]
+DeviceProfileNameAndTypes=NordPhoneStream,Linux

[NordPhoneStream DeviceProfile]
DeviceType=Linux
BaseProfileName=Linux
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.AntiAliasingQuality=2
+CVars=sg.ShadowQuality=1
+CVars=sg.GlobalIlluminationQuality=1
+CVars=sg.ReflectionQuality=1
+CVars=sg.PostProcessQuality=2
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=2
+CVars=sg.FoliageQuality=2
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.ScreenPercentage=75
+CVars=t.MaxFPS=60
