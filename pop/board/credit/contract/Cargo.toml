[package]
name = "pop-board-credit"
version = "0.1.0"
edition = "2021"
description = "Testnet credit score for Pay on Proof agents, read from locked hire and appeals contracts"
license = "MIT"
repository = "https://github.com/vdimarco/rouge-warden"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
strip = true
overflow-checks = true
