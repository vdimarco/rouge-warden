[package]
name = "pay-on-proof-tee"
version = "0.1.0"
edition = "2021"
publish = false
description = "Testnet Pay on Proof that pays when a TEE-signed verdict verifies"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
serde_json = "1"

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
strip = true
overflow-checks = true
