[package]
name = "pop-tee-checker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Delivery checker that runs inside an OutLayer Intel TDX worker"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pop-tee-checker"
path = "src/main.rs"
required-features = ["guest"]

[features]
guest = ["dep:wit-bindgen", "dep:getrandom"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", optional = true }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
wit-bindgen = { version = "0.36", optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
