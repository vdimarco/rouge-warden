[package]
name = "mock-intents"
version = "0.1.0"
edition = "2021"
description = "Testnet stand-in for intents.near: records wNEAR deposits per receiver, as ft_on_transfer does"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
