[package]
name = "pay-on-proof-appeals"
version = "0.1.0"
edition = "2021"
description = "Testnet escrow that pays a failed Pay on Proof delivery only after a Lock jury ruling"
license = "MIT"
repository = "https://github.com/vdimarco/rouge-warden"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
near-sdk = "5.30"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
strip = true
overflow-checks = true
