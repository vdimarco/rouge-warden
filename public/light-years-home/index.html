<body>
<canvas id="view" aria-label="Deep space, seen from a small ship"></canvas>
<canvas id="overlay" aria-hidden="true"></canvas>
<div id="hud-root"></div>
<div id="flash" class="lyh-flash" aria-hidden="true"></div>
<div id="log-root"></div>
<div id="menu-root"></div>
<p id="boot" class="lyh-boot" aria-live="polite">LIGHT YEARS HOME</p>
<pre id="debug" class="lyh-debug" hidden></pre>

<section id="graphics-error" class="lyh-error" role="alert" hidden>

    <h2>Graphics could not start</h2>
    <p>This browser could not open 3D graphics for the drive. Try again, or pick another game.</p>
    <div class="m-actions">
      <button class="primary" type="button" onclick="location.reload()">Try again</button>
      <button type="button" data-switch>Switch game</button>
      <a class="button" href="/">Back to the arcade</a>
    </div>
  </div>
</section>

<script src="/arcade/switch.js"></script>
<script type="module" src="/light-years-home/main.js" onerror="document.getElementById('graphics-error').hidden=false"></script>
