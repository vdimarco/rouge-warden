<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="/arcade/quiet.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Moonwell · Moonlit Islands</title><meta name="description" content="Play pinball across moonlit islands, golden rails, and stone bridges."><meta property="og:image" content="https://warden-alpha-wheat.vercel.app/moonwell/assets/moon-islands.png"><link rel="stylesheet" href="scene.css"></head><body>
<canvas id="world" aria-label="Moonlit island pinball"></canvas>
<header><a href="/">Cottage Arcade</a><span class="brand">MOONWELL</span><button id="pause">Pause</button></header>
<div class="hud"><div><span class="label" id="depth">DUNGEON 01</span><span id="objective">Wake the moon stars</span></div><div class="numbers"><span id="score">0</span><span id="lives">● ● ●</span></div></div>
<div id="message" role="status"></div>
<div class="controls"><button id="left" aria-label="Left flipper">Left <kbd>Z</kbd></button><button id="launch">Play</button><button id="pulse">Pulse <kbd>C</kbd></button><button id="right" aria-label="Right flipper">Right <kbd>X</kbd></button></div>
<section id="dialog" hidden><div><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div id="choices"></div></div></section>
<button id="sound" aria-label="Toggle sound">Sound on</button><script type="module" src="game.js"></script></body></html>
