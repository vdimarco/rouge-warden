<!doctype html>
<html lang="en">
<head>
<script src="/arcade/quiet.js"></script>
<meta charset="utf-8">
<script src="/arcade/switch.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5e1c34">
<title>First Breath · A baby's journey to birth</title>
<meta name="description" content="A gentle game about growing before birth: race as a sperm, guard the egg, grow roots and a heart, answer a voice, turn, and take your first breath.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%235e1c34'/%3E%3Ccircle cx='17' cy='17' r='9' fill='%231a0610' opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffc49c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff0dc' stroke-width='2'/%3E%3Cpath d='M7 9a12 12 0 0 1 9-4' fill='none' stroke='%23fff4e2' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='25' r='2.5' fill='%23ffc53d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The play area: the canvas (the paper sheets), the DOM rings over it, and the stick ring. Only it reads the pointer. -->
<div id="area" aria-label="The play area">
  <canvas id="view" aria-hidden="true"></canvas>
  <svg id="rings" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="stick" hidden aria-hidden="true"></div>
</div>

<!-- The HUD: the stage and clock top left, the score, place and pause top right, the scale bar, the prompt line. -->
<div id="hud" hidden>
  <div class="hud-left">
    <p class="tag name" data-hud="stage"></p>
    <p class="tag" data-hud="clock"></p>
    <p class="tag scale" data-hud="scale"></p>
  </div>
  <div class="hud-right">
    <div class="hud-score">
      <p class="tag" data-hud="score"></p>
      <p class="tag place" data-hud="place" hidden></p>
    </div>
    <button type="button" id="pause" class="pause" data-act="pause" aria-label="Pause"><svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="3" y="2" width="3.4" height="12" rx="0.8"/><rect x="9.6" y="2" width="3.4" height="12" rx="0.8"/></svg></button>
  </div>
  <p class="tag prompt" data-hud="prompt"></p>
</div>

<!-- One caption at a time. -->
<div id="captions" aria-live="polite"></div>

<!-- The title, the stage card, the overlay, the Almost card, pause, the result and the menus. -->
<div id="screens">
  <section id="title" class="screen" data-screen="title" aria-label="Title">
    <a class="back" href="/">‹ Arcade</a>
    <h1>FIRST BREATH</h1>
    <p class="sub">Nine months. Eight small stages. One first breath.</p>
    <p class="note">A gentle story of growing before birth. Cells, the womb and birth are shown simply.</p>
    <button type="button" id="play" class="btn play" data-act="play">Play</button>
    <div class="row">
      <button type="button" class="btn" data-act="stages">Stages</button>
      <button type="button" class="btn" data-act="settings">Settings</button>
      <button type="button" class="btn" data-act="sources">Sources</button>
    </div>
    <div class="row">
      <button type="button" class="btn quiet" data-switch>Switch game</button>
      <button type="button" class="btn quiet" data-act="mute">Sound: On</button>
    </div>
    <p class="best" data-best hidden></p>
  </section>
</div>

<script type="module" src="./main.js"></script>
<script src="/arcade/analytics.js" data-game="first-breath"></script>
</body>
</html>
