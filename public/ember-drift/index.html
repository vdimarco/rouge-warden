<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/arcade/quiet.js"></script>
<script src="/arcade/switch.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ember Drift: steer a dying ember through the night sky. Light stars to stay alive in an endless run or 16 puzzle stages.">
<meta name="theme-color" content="#08071a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2308071a%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23ffae5c%27/%3E%3C/svg%3E">
<title>Ember Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
--night:#08071a; --ink:#120f2c; --haze:#2b2754; --text:#efe9ff; --muted:#a39cc9;
--ember:#ffae5c; --spark:#ffe1b5; --cold:#86a6ff; --cloud:#c2427f;
--f-display:"Tektur","Arial Narrow",system-ui,sans-serif;
--f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
body{color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.score{font:800 clamp(34px,6vw,54px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.chain{margin-top:6px;font:600 14px var(--f-display);color:var(--spark);letter-spacing:.06em;min-height:20px;display:flex;align-items:center;gap:8px}
.chain i{display:block;height:3px;width:70px;background:var(--haze);border-radius:2px;overflow:hidden}
.chain i b{display:block;height:100%;background:var(--ember);width:0}
.goal{font:500 14px var(--f-body);color:var(--muted);max-width:30ch;margin-top:2px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meta{font:500 13px var(--f-display);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.meta b{color:var(--text);font-weight:700}
.btns{display:flex;gap:6px;pointer-events:auto}
.icon-btn{font:600 13px var(--f-body);color:var(--text);background:rgba(18,15,44,.7);border:1px solid var(--haze);border-radius:999px;padding:6px 12px;cursor:pointer}
.icon-btn:hover{border-color:var(--ember)}
.icon-btn:focus-visible,.go:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.region{position:fixed;left:0;right:0;top:28%;text-align:center;font:700 clamp(20px,3.4vw,30px) var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .8s;pointer-events:none}
.region.show{opacity:.85}
.fuel{display:flex;align-items:center;gap:10px}
.fuel span{font:600 12px var(--f-display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.bar{flex:1;height:8px;border-radius:4px;background:var(--haze);overflow:hidden}
.bar b{display:block;height:100%;width:60%;background:linear-gradient(90deg,var(--cloud),var(--ember) 35%,var(--spark));border-radius:4px}
.boost-btn{pointer-events:auto;touch-action:none;padding:9px 18px;font-weight:700}
.boost-btn[aria-pressed="true"]{background:var(--ember);color:var(--night);border-color:var(--ember)}
.bar.low b{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,7,26,.62);z-index:5;
padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.menu[hidden],.hud[hidden]{display:none}
.panel{width:100%;max-width:560px;background:rgba(18,15,44,.92);border:1px solid var(--haze);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.panel h1{font:800 clamp(44px,9vw,68px)/.95 var(--f-display);letter-spacing:.02em;margin:0;color:var(--spark);text-wrap:balance}
.panel h2{font:800 34px/1 var(--f-display);margin:0;color:var(--spark)}
.panel p{margin:0;color:var(--muted);max-width:60ch}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.how li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.how svg{width:28px;height:28px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.stats div{display:flex;flex-direction:column}
.stats span{font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats b{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.stats .new{color:var(--ember)}
.runs>span{font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.runs ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.runs li{color:var(--muted)}
.runs li b{color:var(--text);font:700 15px var(--f-display);margin-right:10px}
.runs li.me b{color:var(--ember)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{font:700 16px var(--f-display);letter-spacing:.08em;color:var(--night);background:var(--ember);border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
.go:hover{background:var(--spark)}
.key{font:600 12px var(--f-display);color:var(--muted)}
.eyebrow{font:600 12px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.panel .goal-big{font:700 19px var(--f-display);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;background:var(--ink);border:1px solid var(--haze);border-radius:12px;color:var(--text);text-align:left;cursor:pointer;font-family:var(--f-body);min-width:0}
.stage-btn:hover:not([disabled]){border-color:var(--ember)}
.stage-btn:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.stage-btn[disabled]{opacity:.4;cursor:not-allowed}
.stage-btn .sn{font:800 20px/1 var(--f-display);color:var(--spark)}
.stage-btn .nm{font-size:12px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.sparks{display:inline-flex;gap:3px}
.sparks svg{width:14px;height:14px}
.panel>.sparks svg{width:30px;height:30px}
@media (prefers-reduced-motion:reduce){.region{transition:none}.bar.low b{animation:none}}

[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>

<div class="top">
<div>
<div class="score" id="score">0</div>

<div class="goal" id="goal"></div>
</div>
<div class="side">
<div class="btns">
<button class="icon-btn" type="button" id="soundBtn" aria-pressed="true">Sound on</button>
<button class="icon-btn" type="button" id="pauseBtn">Pause</button>
<button class="icon-btn" type="button" id="hudSwitch" data-switch>Switch game</button>
</div>
<div class="meta" id="meta"></div>
</div>
</div>
<div class="fuel"><span>Fuel</span><div class="bar" id="bar"><b id="fuel"></b></div><button class="icon-btn boost-btn" type="button" id="boostBtn" aria-pressed="false">Boost</button></div>
</div>
<div class="region" id="region"></div>
<div class="menu" id="menu">
<div class="panel" id="panel"></div>
</div>
<script>

  { glow:[92,24,36],  base:[12,4,10], neb:[[170,40,60],[110,30,80],[200,70,50]] },   // Edge of Night: deep red
];
const skyCache = new Map(); let skyFor = '';

function skyCanvas(k){

const input = {px:0, py:0, active:false, left:false, right:false, mouse:false, boost:false};
let best = +store.get('ember-best', 0) || 0;
function baseState(){
return {state:'play', mode:'endless', seed:(Math.random()*1e9)|0, x:0, y:0, ang:-Math.PI/2, v:BASE, fuel:70, score:0, dist:0, time:0,
chain:[], chainT:0, fading:[], shapes:[], fx:[], trail:[], cam:{x:0,y:0,z:1}, region:-1, longest:0, shapesMade:0, lit:0, shake:0,

}
function newRun(){

G = baseState();
input.active = false; input.left = input.right = false;
hideMenu(); setRegion(0); last = performance.now();
}
const P = Math.PI;
const st = (x, y, o = {}) => ({x, y, ...o});
const RING8 = [4,7,2,5,0,3,6,1];

{name:'Close the Ring', goal:'shape', fuel:55, n:3, chainTime:2.8, clouds:[[0,30,90]], tip:'Light all three stars, then fly back to the first one. Go around the cloud.', start:[0,400,-P/2], R:540, par:7,

{name:'Count to Five', goal:'order', fuel:98, tip:'A wrong star puts out every star you lit. Fly around the others.', start:[0,430,-P/2], R:570, par:12,

stars:[st(0,0,{big:1}), st(0,0,{orbit:[150,0.8,0]}), st(0,0,{orbit:[150,0.8,P]}), st(0,0,{orbit:[270,-0.5,P/2]}), st(0,0,{orbit:[270,-0.5,-P/2]}), st(0,0,{orbit:[390,0.3,0.4]}), st(0,0,{orbit:[390,0.3,0.4+P]})]},

let last = performance.now();
function frame(now){
const dt = Math.min(1/30, (now - last)/1000); last = now;
if(G.state==='play') update(dt);
else if(G.state==='demo') demo(dt);
draw(); $('hud').hidden = G.state==='demo'; if(G.state!=='demo') hud();
requestAnimationFrame(frame);
}
function demo(dt){
const t = G.time; input.active = true; input.left = input.right = false;
const sx = (G.x - G.cam.x)*G.cam.z + W/2, sy = (G.y - G.cam.y)*G.cam.z + H/2;
let target = null, bd = 1e9;
for(const c of nearCells(G.x, G.y, 500)) for(const s of c.stars){ if(s.lit) continue; const d = Math.hypot(s.x - G.x, s.y - G.y); const ahead = Math.cos(Math.atan2(s.y - G.y, s.x - G.x) - G.ang); if(ahead > 0.2 && d < bd){ bd = d; target = s; } }
if(target){ input.px = (target.x - G.cam.x)*G.cam.z + W/2; input.py = (target.y - G.cam.y)*G.cam.z + H/2; }
else { input.px = sx + Math.cos(G.ang + Math.sin(t)*0.6)*100; input.py = sy + Math.sin(G.ang + Math.sin(t)*0.6)*100; }
update(dt); G.fuel = 80; G.score = 0; G.state = 'demo';
}
function startDemo(){
cells = new Map();
G = Object.assign(baseState(), {state:'demo', seed:20261105, ang:-0.4, fuel:80, region:0});
}
startDemo(); titleMenu();
requestAnimationFrame(frame);
})();
</script>
<script src="/arcade/analytics.js" data-game="ember-drift"></script>
