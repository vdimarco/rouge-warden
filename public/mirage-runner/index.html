<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#04060c" />
    <meta
      name="description"
      content="Trust the lights that stay. A scene-native ASCII game in Cottage Arcade."
    />
    <title>Mirage Runner · Cottage Arcade</title>
    <link rel="icon" href="/icons/favicon.svg" />
    <link rel="stylesheet" href="/mirage-runner/style.css" />
    <script src="/arcade/quiet.js"></script>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/mirage-runner/">Mirage Runner</a
        ><a href="/">[ arcade ]</a>
      </header>
      <div class="hud" id="stats" aria-live="off"></div>
      <div class="sea" id="arena" tabindex="0" aria-label="Game area">
        <canvas
          id="scene"
          aria-label="Animated ASCII desert-night landscape"
        ></canvas
        ><canvas
          id="play"
          aria-label="Game objects drawn as colored halftone dots"
        ></canvas>
      </div>
      <section class="console">
        <h1>Mirage Runner</h1>
        <p class="tagline">Trust the lights that stay.</p>
        <p id="status" role="status" aria-live="polite"></p>
        <div class="actions">
          <button id="primary">[ begin ]</button
          ><button id="retry" hidden>[ retry ]</button>
        </div>
        <p class="instructions">
          ← → / A D steer · P pause · six steady beacons to reach the caravan
        </p>
        <div class="touch" aria-label="Touch controls">
          <button data-key="left" aria-label="Steer left">←</button
          ><button data-key="up" aria-label="Steer up">↑</button
          ><button data-key="down" aria-label="Steer down">↓</button
          ><button data-key="right" aria-label="Steer right">→</button
          ><button data-key="action" aria-label="Plant seed">plant</button>
        </div>
        <p id="record" class="record"></p>
      </section>
      <footer>
        <span
          >scene by <a href="https://ascii.rest/desert-night/">ascii.rest</a> ·
          <a href="/mirage-runner/vendor/LICENSE">MIT</a></span
        ><button data-switch>[ other games ]</button>
      </footer>
    </main>
    <script type="module" src="/mirage-runner/game.js"></script>
    <script src="/arcade/switch.js"></script>
  </body>
</html>
