<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3E9D6" />
    <title>Lawn Tennis at the Cottage</title>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/breakthrough/fonts/fraunces-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/breakthrough/fonts/dm-sans-latin-600-normal.woff2") format("woff2");
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #F3E9D6;
        color: #2B2A33;
        overflow: hidden;
        touch-action: none;
      }
      body {
        font-family: "DM Sans", "Gill Sans", "Trebuchet MS", sans-serif;
      }
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
      #court {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #banner {
        position: absolute;
        left: 0;
        right: 0;
        top: 18%;
        margin: 0;
        text-align: center;
        font-family: "Fraunces", Palatino, "Palatino Linotype", serif;
        font-size: 28px;
        font-weight: 600;
        color: #2B2A33;
        pointer-events: none;
      }
      #again {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        min-width: 160px;
        min-height: 48px;
        padding: 12px 22px;
        border: 0;
        border-radius: 999px;
        background: #3E7C8F;
        color: #F3E9D6;
        font: 600 16px/1 "DM Sans", "Gill Sans", sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Lawn Tennis at the Cottage</h1>
    <canvas id="court" aria-label="Backyard tennis court. Tap anywhere to swing. The player moves under the ball."></canvas>
    <p id="banner" hidden></p>
    <button id="again" type="button" hidden>Play again</button>
    <script type="module" src="./game.js"></script>
  </body>
</html>
