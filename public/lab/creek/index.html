<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1f26">
<title>Up the Creek · The Lab</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/lab/kit/lab.css">
<style>
.calib { position: fixed; left: 50%; bottom: calc(var(--sab) + 24px); transform: translateX(-50%); width: min(92vw, 430px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; z-index: 6; text-align: center; }
.calib[hidden] { display: none; }
.calib b { color: var(--gold); }
.calib button { margin-top: 10px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font: 600 15px/1 var(--body); }
</style>
</head>
<body class="toy">
<canvas class="view" id="view" aria-label="Up the Creek"></canvas>
<div class="hud" id="hud" hidden><span id="hEddies">Eddies 0</span><span id="hSwims">Swims 0</span><span id="hTime">0:00</span></div>
<div class="calib ui" id="calib" hidden><div><b>Take one stroke.</b> Tip the phone to one side and rock its top edge, the way you pull a paddle.</div><button type="button" id="calibSkip">Use touch instead</button></div>
<script type="module" src="./main.js"></script>
</body>
</html>
