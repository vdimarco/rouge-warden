<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/arcade/quiet.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1f26">
<title>House Rules · The Lab</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/lab/kit/lab.css">
<style>
body.toy { background: #07090d; }
/* the tools sit at the bottom; main.js fits the layer into the space above them */
.tools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 8px 8px calc(8px + var(--sab)); background: rgba(8, 20, 26, 0.96); border-top: 1px solid var(--line); display: grid; gap: 7px; }
.tools .row { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.tools .row::-webkit-scrollbar { display: none; }
.tools button, .tools select, .tools input { font: 600 13px/1 var(--body); color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 36px; flex: none; }
.tools button { cursor: pointer; }
.tools button[aria-pressed="true"] { border-color: var(--gold); background: rgba(240, 184, 72, 0.18); color: #fff; }
.tools button:disabled { opacity: 0.4; cursor: default; }
.tools .paint { display: grid; justify-items: center; gap: 3px; padding: 5px 6px; min-width: 46px; font-size: 11px; }
.tools .paint i { display: block; width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3); }
.tools .paint[data-p="dig"] i { background: repeating-linear-gradient(45deg, #111 0 3px, #333 3px 6px); }
.tools .go { background: var(--gold); color: #1d1606; border: 0; font-weight: 700; }
.tools .sizes { flex: none; overflow: visible; }
.tools .sizes button { min-width: 36px; padding: 6px; }
.tools .sizes b { display: inline-block; border-radius: 50%; background: var(--ink); vertical-align: middle; }
.tools .sep { flex: 1; }
.meter { display: flex; align-items: center; gap: 8px; font: 600 12px/1.2 var(--body); color: var(--muted); }
.meter .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; min-width: 60px; }
.meter .bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width 0.2s; }
.meter.full .bar i { background: var(--red); }
.tools .status { margin: 0; font: 600 12px/1.3 var(--body); color: var(--ink); }
.tools select.on { border-color: var(--gold); background: rgba(240, 184, 72, 0.18); }
.meter input { flex: 2; min-width: 0; }
@media (max-width: 420px) {
  .tools .row { gap: 5px; }
  .tools button, .tools select { padding: 8px 8px; }
}
@media (min-width: 900px) {
  .tools { left: 50%; right: auto; bottom: 10px; transform: translateX(-50%); width: min(96vw, 980px); border: 1px solid var(--line); border-radius: 14px; }
}
</style>
</head>
<body class="toy">
<canvas class="view" id="view" aria-label="The layer you are painting"></canvas>
<section class="tools ui" id="tools" aria-label="Tools">
  <div class="row paints" id="paints" role="group" aria-label="Paint"></div>
  <div class="row">
    <span class="sizes row" id="sizes" role="group" aria-label="Brush size"></span>
    <select id="critter" aria-label="Place a critter"></select>
    <button type="button" data-tool="tank">Tank</button>
    <button type="button" data-tool="drain">Drains</button>
  </div>
  <div class="row">
    <button type="button" id="undo">Undo</button>
    <button type="button" id="settle">Settle</button>
    <button type="button" id="look">Look</button>
    <button type="button" id="fresh">New</button>
    <span class="sep"></span>
    <button type="button" class="go" id="test">Test it</button>
    <button type="button" id="share" disabled>Share</button>
  </div>
  <div class="meter" id="meter"><input id="name" maxlength="24" placeholder="Name your layer" autocomplete="off" spellcheck="false" aria-label="Name"><span class="bar"><i id="bar"></i></span><span id="size">0 / 2,000</span></div>
  <p class="status" id="status"></p>
</section>
<script type="module" src="./editor.js"></script>
</body>
</html>
