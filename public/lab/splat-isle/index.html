<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splat Isle · Cottage Arcade Lab</title>
<meta name="description" content="A tiny island written as shapes, painted with Gaussian splats like brush strokes, and shown as pixel art. Break things and watch them pop back.">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/lab/kit/lab.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1626; overscroll-behavior: none; }
  .view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; image-rendering: pixelated; }
  .labbar { z-index: 30; }
  /* The title, top middle, in the pixel palette's warm light */
  .tag { position: fixed; top: calc(var(--sat, 0px) + 10px); left: 50%; transform: translateX(-50%); z-index: 5; margin: 0; padding: 6px 14px; border-radius: 999px; background: #1b1626cc; color: #fbe9c4; font: 700 14px/1 var(--body); letter-spacing: 0.08em; pointer-events: none; white-space: nowrap; }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab, 0px) + 72px); z-index: 5; margin: 0; padding: 6px 12px; border-radius: 999px; background: #1b1626b8; color: #fbe9c4e6; font: 500 13px/1.3 var(--body); text-align: center; pointer-events: none; max-width: calc(100vw - 24px); }
  /* The controls: one row on a wide screen, two on a phone. Every control is at least 44 px tall. */
  .controls { position: fixed; left: 8px; right: 8px; bottom: calc(var(--sab, 0px) + 10px); z-index: 10; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: none; }
  .controls > * { pointer-events: auto; }
  .controls button, .goop { min-height: 44px; min-width: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #fbe9c440; background: #1b1626e6; color: #fbe9c4; font: 600 14px/1 var(--body); padding: 0 13px; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: #d26e5a; border-color: #f6c58c; color: #fff8ea; }
  .controls button:disabled { opacity: 0.45; cursor: default; }
  .goop { display: inline-flex; align-items: center; gap: 8px; cursor: default; }
  .goop input { width: 110px; accent-color: #f09a68; height: 28px; }
  .goop output { min-width: 34px; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .controls button, .goop { padding: 0 10px; font-size: 13px; } .goop input { width: 84px; } .hint { bottom: calc(var(--sab, 0px) + 122px); } }
  /* Loading: the island is painted in the page, stroke by stroke, before it can be drawn */
  .loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #1b1626; transition: opacity 0.5s, visibility 0.5s; }
  .loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-box { width: min(380px, calc(100vw - 40px)); text-align: center; color: #fbe9c4; }
  .loading-box h1 { margin: 0 0 6px; font: 800 clamp(34px, 10vw, 54px)/1 var(--body); letter-spacing: 0.06em; color: #f6c58c; text-shadow: 3px 3px 0 #73405f; }
  .loading-box p { margin: 8px 0; font: 500 14px/1.4 var(--body); }
  .bar { height: 10px; background: #2f2340; border: 2px solid #4b3157; }
  .bar i { display: block; height: 100%; width: 0; background: #f09a68; transition: width 0.15s; }
  @media (prefers-reduced-motion: reduce) { .loading, .bar i { transition: none; } }
</style>
</head>
<body class="toy">
<canvas class="view" id="view" aria-label="Splat Isle: a small island at sunset with a cottage, a lighthouse, trees, rocks, clouds and a goat that walks a path, all painted with soft splats and shown as pixel art. Drag to turn round the island. Tap a thing to break it apart; it comes back."></canvas>
<nav class="labbar"><a class="back" href="/lab/">◀ Lab</a><button type="button" id="menu" data-switch>Games</button></nav>
<p class="tag" aria-hidden="true">SPLAT ISLE</p>
<p class="hint" id="hint">Drag to turn · tap a thing to break it</p>
<div class="controls" role="group" aria-label="Splat Isle controls">
  <button type="button" id="bPixel" aria-pressed="true" title="P">Pixel</button>
  <button type="button" id="bPalette" title="C">Palette: Dusk</button>
  <label class="goop" title="The size of every stroke">Goop <input type="range" id="goop" min="0.3" max="3" step="0.1" value="1" aria-label="Stroke size"> <output id="goopValue">1.0×</output></label>
  <button type="button" id="bShapes" aria-pressed="false" title="X">Shapes</button>
  <button type="button" id="bRide" aria-pressed="false" title="G">Ride the goat</button>
  <button type="button" id="bNew" title="N">New island</button>
</div>
<div class="loading" id="loading" role="status" aria-live="polite">
  <div class="loading-box">
    <h1>SPLAT ISLE</h1>
    <p id="loadLine">Painting the island…</p>
    <div class="bar" id="loadingBar" role="progressbar" aria-label="Painting the island" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    <p>Every stroke is laid on shapes written as math, with the sunset light baked in.</p>
  </div>
</div>
<script type="importmap">{"imports":{"three":"/vr/lib/three.module.min.js","three/addons/postprocessing/Pass.js":"/lab/riftwalk/lib/Pass.js","@sparkjsdev/spark":"/lab/riftwalk/lib/spark.module.min.js"}}</script>
<script src="/arcade/switch.js"></script>
<script type="module" src="./main.js"></script>
<script src="/arcade/analytics.js" data-game="splat-isle"></script>
</body>
</html>
