<style>
:root {
  --bg: #0b0f16; --ink: #f3ead3; --muted: #a9a79c; --accent: #ffcf4a; --red: #ff5a4a; --line: #2a3140; --panel: rgba(12, 16, 24, 0.92);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --display: "Bungee", "Impact", sans-serif; --body: "Alegreya Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g fill='none' stroke-linecap='round'><circle cx='20' cy='20' r='11' stroke='%23000' stroke-opacity='.85' stroke-width='5'/><path d='M20 2v9M20 29v9M2 20h9M29 20h9' stroke='%23000' stroke-opacity='.85' stroke-width='5'/><circle cx='20' cy='20' r='11' stroke='%23ffcf4a' stroke-width='2'/><path d='M20 2v9M20 29v9M2 20h9M29 20h9' stroke='%23ffcf4a' stroke-width='2'/><circle cx='20' cy='20' r='2' fill='%23ffcf4a' stroke='%23000' stroke-width='1.2'/></g></svg>") 20 20, crosshair; }
body.menu #game canvas { cursor: default; }
button { font: inherit; color: inherit; }

/* HUD */
.hud { position: fixed; z-index: 10; top: calc(var(--sat) + 8px); left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
.hud-left { display: flex; flex-direction: column; gap: 6px; }
.hearts { display: flex; gap: 3px; flex-wrap: wrap; max-width: 60vw; }
.heart { width: 22px; height: 20px; background: no-repeat center / contain; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)); }
.row { display: flex; gap: 10px; align-items: center; font-weight: 800; font-size: 16px; text-shadow: 0 2px 0 #000; }
.row .pill { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: 0 2px 0 rgba(0,0,0,0.6); }
.dot.cap { background: radial-gradient(circle at 35% 35%, #fff4b0, #e0a820 60%, #8a5a10); }
.dot.hornico { background: radial-gradient(circle at 35% 35%, #bfe6ff, #3a8ad8 60%, #1a3a6a); border-radius: 4px; }
.floor-tag { font-family: var(--display); font-size: 13px; letter-spacing: 0.04em; color: var(--accent); text-shadow: 0 2px 0 #000; }
.combo { font-family: var(--display); font-size: 22px; color: var(--accent); text-shadow: 0 3px 0 #7a3a00, 0 0 12px rgba(255, 180, 60, 0.6); transform-origin: left center; transition: opacity 0.2s; }
.combo[hidden] { display: block; opacity: 0; }
.hud-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
#minimap { width: 118px; height: 118px; border-radius: 10px; background: rgba(8, 11, 18, 0.72); border: 1px solid var(--line); }
.hbtn { pointer-events: auto; border: 1px solid var(--line); background: rgba(12, 16, 24, 0.8); color: var(--ink); border-radius: 10px; min-height: 36px; padding: 0 12px; font-weight: 800; cursor: pointer; }
.hbtns { display: flex; gap: 6px; }
.bossbar { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + 132px); width: min(520px, 86vw); text-align: center; pointer-events: none; }
.bossbar span { font-family: var(--display); font-size: 14px; color: #ffd0d0; text-shadow: 0 2px 0 #000; }
.bossbar div { height: 12px; border-radius: 6px; background: #1a0c10; border: 2px solid #000; overflow: hidden; margin-top: 3px; }
.bossbar i { display: block; height: 100%; width: 100%; background: linear-gradient(#ff7a6a, #c0203a); transition: width 0.15s; }
.bossbar[hidden] { display: none; }

/* bottom: gun and horn */
.dock { position: fixed; z-index: 10; left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); bottom: calc(var(--sab) + 12px); display: flex; align-items: flex-end; justify-content: space-between; pointer-events: none; }
.gun { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; min-height: 52px; }
.gun canvas { width: 64px; height: 30px; }
.gunwrap { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; }
.slots { display: flex; gap: 6px; pointer-events: auto; }
.slot { width: 52px; height: 34px; border-radius: 8px; border: 2px solid var(--r, #555); background: rgba(12, 16, 24, 0.85) center / 44px auto no-repeat; position: relative; cursor: pointer; padding: 0; }
.slot[aria-pressed="true"] { background-color: rgba(60, 50, 20, 0.95); box-shadow: 0 0 0 2px var(--accent); }
.slot i { position: absolute; right: 3px; bottom: 2px; font-style: normal; font-size: 10px; font-weight: 800; color: var(--accent); text-shadow: 0 1px 0 #000; }
.gun .rar { font-size: 11px; font-weight: 800; }
.gun b { display: block; font-size: 15px; }
.gun small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.gun .reload { color: var(--accent); }
.horn { pointer-events: auto; width: 74px; height: 74px; border-radius: 50%; border: 3px solid #3a8ad8; background: radial-gradient(circle at 40% 35%, #2a5a8a, #10243e); color: #dff2ff; font-family: var(--display); font-size: 12px; line-height: 1.1; cursor: pointer; box-shadow: 0 4px 0 #061020; }
.horn:disabled { opacity: 0.35; }
.voice { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 96px); max-width: min(560px, 90vw); padding: 8px 14px; border-radius: 10px; background: rgba(8, 11, 18, 0.82); border: 1px solid var(--line); font-size: 17px; font-style: italic; text-align: center; pointer-events: none; transition: opacity 0.4s; }
.voice b { font-style: normal; color: var(--accent); }
.voice.off { opacity: 0; }
.toast { position: fixed; z-index: 11; left: calc(var(--sal) + 10px); top: calc(var(--sat) + 124px); width: min(290px, 70vw); padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); font-size: 14px; pointer-events: auto; cursor: pointer; transition: opacity 0.4s, transform 0.4s; }
.toast.off { opacity: 0; transform: translateX(20px); pointer-events: none; }
.toast h4 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.toast h4 small { color: var(--muted); font-weight: 400; }
.toast .bar { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 2px 6px; margin-top: 3px; border-radius: 4px; background: linear-gradient(90deg, rgba(255, 207, 74, 0.28) var(--p), rgba(255,255,255,0.04) var(--p)); }
.banner { position: fixed; z-index: 12; left: 50%; top: 36%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; transition: opacity 0.5s; }
.banner strong { display: block; font-family: var(--display); font-size: clamp(30px, 8vw, 58px); color: var(--accent); text-shadow: 0 4px 0 #6a3000, 0 0 30px rgba(255, 170, 40, 0.5); }
.banner span { display: block; font-size: 19px; font-weight: 700; text-shadow: 0 2px 0 #000; margin-top: 4px; }
.banner.off { opacity: 0; }
.popup { position: fixed; z-index: 12; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; pointer-events: none; transition: opacity 0.4s, transform 0.4s; background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 10px 16px; max-width: 86vw; }
.popup b { display: block; font-family: var(--display); font-size: 18px; color: var(--accent); }
.popup span { display: block; font-size: 15px; margin-top: 3px; }
.popup.off { opacity: 0; transform: translate(-50%, -10px); }
.joy { position: fixed; z-index: 9; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255, 207, 74, 0.5); }
.joy[hidden] { display: none; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; overflow-y: auto; display: grid; place-items: start center; padding: calc(var(--sat) + 18px) calc(var(--sar) + 16px) calc(var(--sab) + 24px) calc(var(--sal) + 16px); background: radial-gradient(ellipse at top, rgba(40, 30, 10, 0.9), rgba(6, 8, 12, 0.97)); }
.overlay[hidden] { display: none; }
.card { width: 100%; max-width: 760px; }
.card.center { align-self: center; text-align: center; max-width: 520px; }
.title-art { display: block; width: 100%; max-height: 38vh; object-fit: cover; border-radius: 14px; box-shadow: 0 10px 34px rgba(0,0,0,0.6); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lede { font-size: 17px; line-height: 1.4; }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 14px 0 8px; color: var(--accent); }
.roster { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.friend { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 10px; border-radius: 12px; border: 2px solid var(--line); background: #141924; cursor: pointer; }
.friend img { height: 120px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.friend b { font-size: 15px; text-align: center; line-height: 1.1; }
.friend small { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; }
.friend[aria-pressed="true"] { border-color: var(--accent); background: #2a2310; }
.friend[aria-pressed="true"] small { color: var(--accent); }
.gears { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.gear { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px 12px; border-radius: 12px; border: 2px solid var(--line); background: #141924; cursor: pointer; }
.gear img { width: 88px; height: 40px; object-fit: contain; image-rendering: auto; }
.gear em { font-style: normal; font-family: var(--display); font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
.gear b { font-size: 16px; }
.gear small { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; }
.gear[aria-pressed="true"] { border-color: var(--accent); background: #2a2310; }
.gear[aria-pressed="true"] em { color: var(--accent); }
.keys { font-size: 15px; color: #c9c4b4; line-height: 1.45; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.card.center .btns { justify-content: center; }
.btn { border: none; border-radius: 12px; padding: 14px 22px; font-family: var(--display); font-size: 18px; background: var(--accent); color: #231800; cursor: pointer; box-shadow: 0 4px 0 #8a6000; }
.btn.quiet { background: #1a2130; color: var(--ink); box-shadow: 0 4px 0 #070a10; font-family: var(--body); font-weight: 800; font-size: 16px; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; text-align: left; font-size: 17px; margin: 14px auto; max-width: 340px; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-weight: 800; }
.record { font-family: var(--display); color: var(--accent); font-size: 18px; margin: 6px 0; }
.big { font-family: var(--display); font-size: clamp(34px, 9vw, 52px); color: var(--red); margin: 8px 0 0; text-shadow: 0 4px 0 #400; }
.list { font-size: 15px; line-height: 1.4; }
.list li { margin-bottom: 6px; }
.ledger .q { font-size: 14px; margin: 6px 0; }
.ledger .q b { color: var(--accent); }
@media (max-width: 520px) { .friend img { height: 84px; } .friend b { font-size: 13px; } .friend small { font-size: 11px; } .roster { gap: 5px; } #minimap { width: 96px; height: 96px; } }

/* ---------- title screen: one screen, no scrolling ---------- */
.overlay.ts { padding: 0; overflow: hidden; display: block; height: 100dvh; background: #06080e; }
.ts-bg { position: absolute; inset: 0; overflow: hidden; }
.ts-bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; animation: kb 18s ease-in-out infinite alternate; }
.ts-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,8,14,0) 35%, rgba(6,8,14,0.75) 62%, rgba(6,8,14,0.97) 85%); }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.05) translate(-0.8%, 0.5%); } }
.ts-bg { background: #06080e center / cover no-repeat; }
.ts-bg::before { content: ""; position: absolute; inset: 0; background: inherit; opacity: 0.5; }
.ts-bg img { transform-origin: 50% 0; }
.ts-shine { display: none; position: absolute; top: 0; left: -40%; width: 30%; height: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent); transform: skewX(-20deg); animation: shine 4.5s ease-in-out infinite; mix-blend-mode: overlay; z-index: 1; }
@keyframes shine { 0%, 55% { left: -40%; } 85%, 100% { left: 130%; } }
.ts-fx { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.ts-fx b { position: absolute; bottom: -20px; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle, #fff 0 30%, #9adcff 60%, transparent 70%); opacity: 0.7; animation: rise linear infinite; }
@keyframes rise { to { transform: translateY(-110vh) translateX(20px); opacity: 0; } }
.ts-panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: min(1.4vh, 10px); padding: 0 calc(var(--sar) + 12px) calc(var(--sab) + min(2vh, 16px)) calc(var(--sal) + 12px); }
.ts-roster { display: flex; justify-content: center; align-items: flex-end; gap: min(2vw, 12px); width: 100%; max-width: 720px; }
.ts-roster .friend { flex: 1 1 0; max-width: 120px; padding: 0; border: none; background: none; filter: grayscale(0.6) brightness(0.7); transition: transform 0.18s cubic-bezier(.3,1.6,.5,1), filter 0.18s; }
.ts-roster .friend img { width: 100%; height: min(26vh, 220px); object-fit: contain; object-position: bottom; }
.ts-roster .friend b, .ts-roster .friend small { display: none; }
.ts-roster .friend[aria-pressed="true"] { filter: drop-shadow(0 0 14px rgba(255, 207, 74, 0.9)); transform: scale(1.18) translateY(-4px); z-index: 1; animation: bob 0.9s ease-in-out infinite; background: none; }
.ts-roster .friend:hover { filter: none; }
@keyframes bob { 0%, 100% { transform: scale(1.18) translateY(-4px); } 50% { transform: scale(1.18) translateY(-10px); } }
.ts-roster .friend.pop { animation: drop 0.5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes drop { from { transform: translateY(80px) scale(0.6); opacity: 0; } }
.ts-who { margin: 0; font-family: var(--display); font-size: clamp(16px, 3.4vh, 26px); color: var(--accent); text-shadow: 0 3px 0 #6a3000, 0 0 18px rgba(255,170,40,0.5); text-align: center; line-height: 1.1; }
.ts-who small { display: block; font-family: inherit; font-size: 0.55em; color: var(--ink); text-shadow: 0 2px 0 #000; letter-spacing: 0.04em; }
.ts-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 620px; }
.ts-gears { display: flex; gap: 8px; flex: 1; }
.ts-gears .gear { flex: 1; padding: 6px 4px; gap: 0; border-radius: 12px; background: rgba(20,25,36,0.85); transition: transform 0.15s; }
.ts-gears .gear img { width: min(64px, 14vw); height: min(28px, 5vh); }
.ts-gears .gear b, .ts-gears .gear small { display: none; }
.ts-gears .gear em { font-size: 12px; }
.ts-gears .gear[aria-pressed="true"] { transform: translateY(-3px); box-shadow: 0 0 16px rgba(255,207,74,0.5); }
.btn.ts-go { font-size: clamp(22px, 4.6vh, 34px); padding: min(1.8vh, 14px) clamp(24px, 6vw, 44px); background: linear-gradient(#ff6a4a, #d8261e); color: #fff; text-shadow: 0 3px 0 #6a0a00; box-shadow: 0 5px 0 #6a0a00, 0 0 30px rgba(255,80,40,0.6); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); box-shadow: 0 5px 0 #6a0a00, 0 0 46px rgba(255,120,40,0.9); } }
.ts-meta { display: flex; gap: 12px; align-items: center; font-family: var(--display); font-size: 12px; color: var(--muted); }
.ts-chip { border: 1px solid var(--line); background: rgba(20,25,36,0.8); color: var(--ink); border-radius: 99px; padding: 5px 12px; font: inherit; cursor: pointer; }
.ts .ts-panel > * { animation: up 0.5s cubic-bezier(.3,1.4,.5,1) both; }
.ts .ts-who { animation-delay: 0.15s; } .ts .ts-row { animation-delay: 0.25s; } .ts .ts-meta { animation-delay: 0.35s; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@media (orientation: portrait) { .ts-bg img { height: min(62%, 118vw); bottom: auto; object-position: 50% 0; } .ts-bg::after { background: linear-gradient(180deg, rgba(6,8,14,0) 30%, rgba(6,8,14,0.9) 50%, #06080e 60%); } .ts-roster .friend img { height: min(24vh, 200px); } }
@media (orientation: landscape) and (max-height: 500px) { .ts-roster .friend img { height: 24vh; } }
/* very wide screens: show the whole cover, with a blurred copy filling the sides */
@media (orientation: landscape) and (min-aspect-ratio: 2/1) { .ts-bg img { object-fit: contain; object-position: 50% 0; } }

/* ---------- intro: tap to start, then a fast, loud open ---------- */
.intro { position: fixed; inset: 0; z-index: 50; background: #000; overflow: hidden; display: grid; place-items: center; cursor: pointer; }
.intro[hidden] { display: none; }
.intro img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
.intro img.intro-blur { object-fit: cover; filter: none; opacity: 0; }
.intro.reveal img.intro-blur { opacity: 0.45; }
.intro.reveal img { opacity: 1; transition: opacity 0.05s; }
.intro.reveal img#introArt { animation: punch 0.6s cubic-bezier(.2,1.6,.4,1); }
@media (orientation: portrait) { .intro img#introArt { object-fit: cover; object-position: 50% 0; } .intro-words b { font-size: min(18vw, 12vh); } .intro-words b.num { font-size: min(44vw, 30vh); } }
@media (orientation: landscape) and (min-aspect-ratio: 16/9) and (max-aspect-ratio: 2/1) { .intro img#introArt { object-fit: cover; object-position: 50% 25%; } }
/* the pictures that slam in with the words */
.intro-words.pic { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: calc(var(--sat) + 2vh) 2vw calc(var(--sab) + 3vh); }
.intro .intro-pic { position: static; inset: auto; display: block; flex: 1 1 0; min-height: 0; width: 100%; height: auto; max-width: none; max-height: none; opacity: 1; margin: 0 0 1vh; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.8)); animation: picslam 0.38s cubic-bezier(.2,1.7,.4,1) both; }
.intro .intro-pic.round { object-fit: cover; border-radius: 18px; border: 4px solid var(--accent); box-shadow: 0 0 30px rgba(255,180,40,0.5); }
.intro-words.pic b { flex: none; }
@keyframes picslam { from { transform: scale(0.3) rotate(8deg); opacity: 0; } }
@media (orientation: landscape) and (max-height: 500px) { .intro .intro-pic { margin-bottom: 0; } .intro-words b.num { font-size: min(20vw, 26vh); } .intro-words b { font-size: min(12vw, 16vh); } }
@keyframes punch { from { transform: scale(1.5); } to { transform: scale(1.04); } }
.intro-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.intro-flash.on { animation: flash 0.35s ease-out; }
@keyframes flash { from { opacity: 0.95; } to { opacity: 0; } }
.intro-press { position: absolute; z-index: 4; bottom: calc(var(--sab) + 7vh); left: 0; right: 0; text-align: center; margin: 0; font-family: var(--display); font-size: clamp(22px, 5vh, 40px); color: #fff; text-shadow: 0 4px 0 #6a0a00, 0 0 24px rgba(255,80,40,0.9); animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.intro.go .intro-press, .intro.beat .intro-press { display: none; }
.intro.coin .intro-press { display: block; animation: none; color: var(--accent); }
.intro.coin .intro-press::after { content: ""; }
.intro.coin { animation: shake 0.28s linear 0.84s; }
.intro-press { padding: 8px 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,0.55), transparent); }
.intro-words { position: relative; z-index: 2; text-align: center; font-family: var(--display); pointer-events: none; }
.intro-words { width: 100%; padding: 0 4vw; }
.intro-words b { display: block; font-size: min(15vw, 24vh, 190px); line-height: 0.9; white-space: nowrap; color: var(--accent); text-shadow: 0 6px 0 #6a3000, 0 0 40px rgba(255,160,40,0.8); -webkit-text-stroke: 2px #2a1400; animation: slam 0.32s cubic-bezier(.2,1.8,.4,1) both; }
.intro-words b.num { font-size: min(34vw, 42vh, 380px); color: #fff; }
.intro-words b.red { color: #ff4a3a; text-shadow: 0 6px 0 #5a0000, 0 0 40px rgba(255,60,40,0.9); }
@keyframes slam { from { transform: scale(3.2) rotate(-6deg); opacity: 0; } 60% { opacity: 1; } }
.intro.shake { animation: shake 0.28s linear; }
@keyframes shake { 20% { transform: translate(-10px, 6px); } 40% { transform: translate(9px, -8px); } 60% { transform: translate(-7px, -4px); } 80% { transform: translate(5px, 7px); } }
.plunge { position: absolute; left: 50%; top: 50%; width: 16px; height: 70px; z-index: 3; pointer-events: none; animation: fly 0.9s cubic-bezier(.1,.7,.3,1) forwards; }
.plunge::before { content: ""; position: absolute; left: 6px; top: 22px; width: 5px; height: 48px; border-radius: 3px; background: #b8844a; box-shadow: inset -1px 0 #6a4424; }
.plunge::after { content: ""; position: absolute; left: -8px; top: 0; width: 32px; height: 26px; border-radius: 16px 16px 6px 6px; background: radial-gradient(circle at 35% 30%, #ff8a7a, #d8261e 55%, #7a0a0a); }
@keyframes fly { from { transform: translate(-50%, -50%) rotate(0) scale(0.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1.1); opacity: 0; } }

/* ---------- how to play: shown before the first run ---------- */
.howto { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(4, 6, 12, 0.82); padding: calc(var(--sat) + 12px) 14px calc(var(--sab) + 12px); }
.howto[hidden] { display: none; }
.howto-card { width: min(680px, 100%); max-height: 100%; overflow: auto; text-align: center; animation: up 0.4s cubic-bezier(.3,1.4,.5,1) both; }
.howto-title { margin: 0 0 12px; font-family: var(--display); font-size: clamp(26px, 5vh, 40px); color: var(--accent); text-shadow: 0 4px 0 #6a3000; }
.howto-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
.howto-row { display: flex; flex-direction: column; gap: 6px; padding: 6px 6px 10px; border-radius: 12px; background: rgba(20, 25, 36, 0.92); border: 1px solid var(--line); }
.howto-row video { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; background: #0b0f16; display: block; }
.howto-row > div { padding: 0 6px; }
.howto-row i { flex: none; width: 44px; height: 44px; display: grid; place-items: center; font-style: normal; font-size: 26px; border-radius: 10px; background: #2a2310; }
.howto-row b { display: block; font-family: var(--display); font-size: 15px; color: var(--accent); }
.howto-row span { font-size: 14px; color: var(--ink); line-height: 1.25; }
.howto-goal { margin: 12px 0 14px; font-size: 14px; color: var(--muted); }
.hint { position: fixed; z-index: 12; left: 50%; bottom: calc(var(--sab) + 96px); transform: translateX(-50%); padding: 8px 14px; border-radius: 99px; background: rgba(12, 16, 24, 0.88); border: 1px solid var(--accent); color: var(--ink); font-size: 14px; white-space: nowrap; pointer-events: none; transition: opacity 0.4s; }
.hint[hidden] { display: none; }

/* a soft vignette over the game view, only while playing */
body.vignette:not(.menu)::after { content: ""; position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 55%, rgba(0,0,0,0.38) 100%); }

/* The HUD and menus grow with big screens: sized for about 1280 x 760, scaled up to twice that. */
:root { --ui: 1; }
.hud, .combo, .bossbar, .dock, .voice, .toast, .banner, .popup, .hint, .ledger, .howto-card, .ts-panel, #pause .card, #dead .card { zoom: var(--ui); }

/* the music: a round note button top left; while the song plays, SoundCloud's slim player sits beside it
   (SoundCloud asks that its player stay visible while it plays, so it's shrunk, not hidden) */
.remix { position: fixed; z-index: 55; left: calc(var(--sal) + 10px); top: calc(var(--sat) + 78px); display: flex; align-items: center; gap: 6px; zoom: var(--ui); }
#title:not([hidden]) ~ .remix, body.menu .remix { top: calc(var(--sat) + 10px); }
#remixNote { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(8, 11, 18, 0.85); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
#remixNote[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(255, 207, 74, 0.45); animation: notepulse 1.2s ease-in-out infinite; }
@keyframes notepulse { 50% { transform: scale(1.08); } }
.remix-strip { width: 150px; height: 20px; border-radius: 6px; overflow: hidden; background: rgba(8, 11, 18, 0.85); }
.remix-strip[hidden] { display: none; }
.remix-strip iframe { width: 100%; height: 20px; border: 0; display: block; }

/* the fighter picker: each fighter on a card with a name plate, so it reads as something to tap */
.ts-bg::after { background: linear-gradient(180deg, rgba(6,8,14,0) 30%, rgba(6,8,14,0.82) 52%, rgba(6,8,14,0.97) 70%); }
.ts-pick { margin: 0; font-family: var(--display); font-size: clamp(12px, 2.2vh, 16px); letter-spacing: 0.12em; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(255,207,74,0.6); }
.ts-roster { gap: min(1.6vw, 10px); margin-top: 4px; }
.ts-roster .friend { min-width: 0; }
.ts-roster .friend[aria-pressed="true"] { transform: translateY(-3px) scale(1.06); animation: none; }
@media (orientation: landscape) and (max-height: 500px) { .ts-pick { display: none; } }
@media (max-width: 480px) { .ts-roster .friend b { font-size: 8px; letter-spacing: 0; } }
.ts-roster .friend { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 2px 0; border-radius: 14px; border: 2px solid rgba(255,255,255,0.18);
  background: linear-gradient(180deg, rgba(40,48,70,0.55), rgba(10,14,24,0.92)); filter: none; opacity: 0.82; cursor: pointer;
  box-shadow: 0 6px 14px rgba(0,0,0,0.5); transition: transform 0.18s cubic-bezier(.3,1.6,.5,1), opacity 0.18s, border-color 0.18s; }
.ts-roster .friend:hover { opacity: 1; transform: translateY(-4px); border-color: rgba(255,255,255,0.45); }
.ts-roster .friend img { filter: drop-shadow(0 0 6px rgba(255,255,255,0.25)); }
.ts-roster .friend b { display: block; width: 100%; margin-top: 2px; padding: 3px 2px; border-radius: 0 0 12px 12px; font-family: var(--display); font-size: clamp(9px, 1.4vh, 12px); letter-spacing: 0.04em; color: #fff; background: rgba(0,0,0,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ts-roster .friend[aria-pressed="true"] { opacity: 1; border-color: var(--accent); background: linear-gradient(180deg, rgba(255,190,60,0.35), rgba(40,26,6,0.95));
  box-shadow: 0 0 0 2px rgba(255,207,74,0.35), 0 0 26px rgba(255,190,60,0.75), 0 8px 18px rgba(0,0,0,0.6); filter: none; }
.ts-roster .friend[aria-pressed="true"] b { background: var(--accent); color: #2a1400; }
.ts-roster .friend[aria-pressed="true"]::after { content: "✓"; position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #2a1400; font: 900 14px/22px sans-serif; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.6); }
</style>
</head>
