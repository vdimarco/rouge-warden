name: Hermes watch and phone

on:
  pull_request:
    paths:
      - "wear/**"
      - "mobile/**"
      - "voice/**"
      - "qa/voice/**"
      - ".github/workflows/hermes-wear.yml"
  push:
    branches: [main]
    paths:
      - "wear/**"
      - "mobile/**"
      - "voice/**"
      - "qa/voice/**"
      - ".github/workflows/hermes-wear.yml"

permissions:
  contents: read

jobs:
  apks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voice/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
      - name: Relay tests
        run: npm ci --prefix voice && npm test --prefix voice
      - name: Protocol tests and debug APKs
        working-directory: wear
        run: ./gradlew :protocol:test :wear-app:assembleDebug :phone-app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-watch-debug
          path: wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-phone-debug
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
