# Pay on Proof (pop/): contract tests, and read-only checks of the live mainnet contract.
# Nothing here signs a transaction or needs a key.
name: pay-on-proof

on:
  push:
    branches: [main]
    paths: ["pop/**", ".github/workflows/pop.yml"]
  pull_request:
    paths: ["pop/**", ".github/workflows/pop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pop
            .github
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version
      - name: cargo test
        run: cd pop/contract && cargo test

  mainnet:
    name: Read the live mainnet contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pop
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify.mjs (no install, no key)
        run: node pop/scripts/verify.mjs mainnet
      - name: MCP server read tools, no key
        run: cd pop && npm ci --no-audit --no-fund && node test/mcp-read.test.mjs

  board:
    name: Board score, contracts, and live read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pop
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: score and event tests
        run: node --test pop/board/test/*.test.mjs
      - name: credit and pool contracts
        run: |
          cargo test --manifest-path pop/board/credit/contract/Cargo.toml
          cargo test --manifest-path pop/board/pool/contract/Cargo.toml
      - name: read the board sources, no key
        run: node pop/board/scripts/verify.mjs
