name: Shared creatures browser QA
on:
  push:
    branches: ['codex/shared-procedural-creatures']
    paths: ['public/arcade/creatures/**', 'public/tidebreak/**', 'qa/creatures/**', 'qa/tidebreak/creatures.test.mjs', '.github/workflows/creature-browser.yml']
  pull_request:
    paths: ['public/arcade/creatures/**', 'public/tidebreak/**', 'qa/creatures/**', 'qa/tidebreak/creatures.test.mjs', '.github/workflows/creature-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exports, neutral behavior and full matches
        run: node qa/creatures/shared.test.mjs && node qa/tidebreak/creatures.test.mjs && node qa/tidebreak/base-attacks.test.mjs && node qa/tidebreak/hero-identities.test.mjs && node qa/tidebreak/legends.test.mjs && node qa/tidebreak/sim.test.mjs
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, phone, small-phone, landscape, compact-desktop, short-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix qa/browser
      # Chromium from Playwright's own host, cached by the lockfile. Not --with-deps in one step: on 2026-11-11 the
      # runner's Ubuntu mirror stopped resolving and that apt step ran until the job was cancelled (see arcade-voting.yml).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/browser/package-lock.json') }}
      - run: cd qa/browser && npx playwright install chromium
        timeout-minutes: 4
      # Fonts and system libraries through apt, best effort: when the mirror does not resolve, this gives up after
      # 3 minutes instead of hanging the job, and the tests run with the fonts the runner image already has.
      - run: cd qa/browser && npx playwright install-deps chromium
        timeout-minutes: 3
        continue-on-error: true
      - name: Verify reference selection, creature display and controls
        run: node qa/creatures/browser.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/qa/browser/node_modules
          SHOTS: ${{ github.workspace }}/test-results/creatures
          CREATURE_VIEWPORT: ${{ matrix.viewport }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creatures-${{ matrix.viewport }}
          path: test-results/creatures
          retention-days: 14
  browser:
    needs: [simulation, viewport]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require simulation and every viewport
        env:
          SIMULATION_RESULT: ${{ needs.simulation.result }}
          VIEWPORT_RESULT: ${{ needs.viewport.result }}
        run: test "$SIMULATION_RESULT" = success && test "$VIEWPORT_RESULT" = success
