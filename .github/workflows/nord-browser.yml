name: NORD browser player QA
on:
  pull_request:
    paths:
      - 'games/nord-unreal/Browser/**'
      - 'qa/browser/package.json'
      - 'qa/browser/package-lock.json'
      - '.github/workflows/nord-browser.yml'
  push:
    branches: [main]
    paths:
      - 'games/nord-unreal/Browser/**'
      - 'qa/browser/package.json'
      - 'qa/browser/package-lock.json'
      - '.github/workflows/nord-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nord-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/nord-unreal/Browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the nord-montreal Vercel project.
          node-version: '24'
      - run: npm ci
      - name: Unit checks
        run: npm test
      - name: Ignored build step syntax
        run: bash -n vercel-ignore.sh
      - run: npm ci --prefix ../../../qa/browser
      # Chromium from Playwright's own host, cached by the lockfile. Not --with-deps in one step: on 2026-11-11 the
      # runner's Ubuntu mirror stopped resolving and that apt step ran until the job was cancelled (see arcade-voting.yml).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/browser/package-lock.json') }}
      - run: npx playwright install chromium
        working-directory: qa/browser
        timeout-minutes: 4
      # Fonts and system libraries through apt, best effort: when the mirror does not resolve, this gives up after
      # 3 minutes instead of hanging the job, and the tests run with the fonts the runner image already has.
      - run: npx playwright install-deps chromium
        working-directory: qa/browser
        timeout-minutes: 3
        continue-on-error: true
      - name: Page checks without a running game
        run: |
          export NORD_CHROMIUM_PATH="$(cd ../../../qa/browser && node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")"
          npm run test:browser
