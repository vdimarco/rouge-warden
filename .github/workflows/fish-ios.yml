name: Reel It In iOS app
# Builds the iPhone app in apps/fish on a Mac, so a change that breaks only the iOS build shows on its pull request. It
# builds for a device with no code signing: no Apple account or secret is needed. The signed build and the upload to App
# Store Connect stay on a Mac with Xcode (apps/fish/README.md). A Mac runner uses Actions minutes 10 times as fast as
# Linux, so this runs only when the game or the app changes.
on:
  pull_request:
    paths: ['public/fish/**', 'apps/fish/**', '.github/workflows/fish-ios.yml']
  push:
    branches: [main]
    paths: ['public/fish/**', 'apps/fish/**', '.github/workflows/fish-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fish-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/fish/package-lock.json
      # App Store uploads need Xcode 26 and the iOS 26 SDK: use the newest Xcode 26 on the runner
      - name: Pick Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - run: npm ci --prefix apps/fish
      # cap sync runs the version and store settings check (native-check.mjs) after it copies www/ into the iOS project
      - name: Build www/ and copy it into the iOS project
        working-directory: apps/fish
        run: npm run build:www && npx cap sync ios
      - name: Build the app for a device, unsigned
        working-directory: apps/fish/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
