name: Table Tennis phone motion QA
on:
  pull_request:
    paths: ['public/pingpong/**', 'qa/pingpong/**', '.github/workflows/pingpong-motion.yml']
  push:
    branches: [main]
    paths: ['public/pingpong/**', 'qa/pingpong/**', '.github/workflows/pingpong-motion.yml']
permissions:
  contents: read
jobs:
  phone-motion:
    # Pinned: ubuntu-latest became Ubuntu 26.04, where Playwright 1.51 refuses to install Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/pingpong/
            /public/arcade/
            /public/breakthrough/fonts/
            /public/icons/
            /public/favicon.ico
            /public/wild/index.html
            /qa/pingpong/
            /qa/browser/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix qa/browser
      # Chromium from Playwright's own host, cached by the lockfile. Not --with-deps in one step: on 2026-11-11 the
      # runner's Ubuntu mirror stopped resolving and that apt step ran until the job was cancelled (see arcade-voting.yml).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/browser/package-lock.json') }}
      - run: cd qa/browser && npx playwright install chromium
        timeout-minutes: 4
      # Fonts and system libraries through apt, best effort: when the mirror does not resolve, this gives up after
      # 3 minutes instead of hanging the job, and the tests run with the fonts the runner image already has.
      - run: cd qa/browser && npx playwright install-deps chromium
        timeout-minutes: 3
        continue-on-error: true
      - run: node --test qa/pingpong/phone-motion.test.mjs qa/pingpong/bat.test.mjs qa/pingpong/rules.test.mjs qa/pingpong/rally.test.mjs qa/pingpong/gate.test.mjs qa/pingpong/winrate.test.mjs qa/pingpong/art.test.mjs
      - run: python3 -m http.server 8765 --directory public > /tmp/tennis-server.log 2>&1 &
      - run: node qa/pingpong/phone-motion.e2e.mjs
        env:
          NODE_PATH: qa/browser/node_modules
      - run: node --test qa/pingpong/desktop.test.mjs
        env:
          NODE_PATH: qa/browser/node_modules
      - name: Server log
        if: failure()
        run: tail -60 /tmp/tennis-server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-motion-screenshots
          path: test-results/phone-motion/
