name: Pinball browser QA
on:
  pull_request:
    paths:
      - 'public/lab/tilt/**'
      - 'public/lab/kit/**'
      # the lab kit imports these two Reel It In modules; other fish changes do not touch pinball
      - 'public/fish/js/haptics.js'
      - 'public/fish/js/motion.js'
      - 'qa/lab/**'
      - 'qa/fish/lib.mjs'
      - 'qa/browser/**'
      - '.github/workflows/pinball-browser.yml'
  push:
    branches: [main]
    paths:
      - 'public/lab/tilt/**'
      - 'public/lab/kit/**'
      # the lab kit imports these two Reel It In modules; other fish changes do not touch pinball
      - 'public/fish/js/haptics.js'
      - 'public/fish/js/motion.js'
      - 'qa/lab/**'
      - 'qa/fish/lib.mjs'
      - 'qa/browser/**'
      - '.github/workflows/pinball-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinball-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix qa/browser
      # Chromium from Playwright's own host, cached by the lockfile. Not --with-deps in one step: on 2026-11-11 the
      # runner's Ubuntu mirror stopped resolving and that apt step ran until the job was cancelled (see arcade-voting.yml).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/browser/package-lock.json') }}
      - run: cd qa/browser && npx playwright install chromium
        timeout-minutes: 4
      # Fonts and system libraries through apt, best effort: when the mirror does not resolve, this gives up after
      # 3 minutes instead of hanging the job, and the tests run with the fonts the runner image already has.
      - run: cd qa/browser && npx playwright install-deps chromium
        timeout-minutes: 3
        continue-on-error: true
      - name: Serve game
        run: |
          python3 -m http.server 8765 --directory public > /tmp/pinball-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8765/lab/tilt/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pinball-server.log
          exit 1
      - name: Physics simulation
        run: |
          node qa/lab/tilt.sim.mjs
          node qa/lab/tilt.adventure.sim.mjs
          node qa/lab/tilt.camera.sim.mjs
          node qa/lab/tilt.motion.sim.mjs
          node qa/lab/tilt.field.sim.mjs
          node qa/lab/tilt.transit.sim.mjs
          node qa/lab/tilt.reverse.sim.mjs
          node qa/lab/tilt.warp.sim.mjs
          node qa/lab/tilt.rallies.sim.mjs
          node qa/lab/tilt.skill.sim.mjs
      - name: Browser interactions and responsive layout
        run: npm run test:pinball --prefix qa/browser
        env:
          SHOTS: ${{ github.workspace }}/test-results/pinball
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinball-screenshots
          path: test-results/pinball
          if-no-files-found: warn
          retention-days: 14
