name: Shore landscape 3D QA
on:
  pull_request:
    paths: ['public/tidebreak/**', 'qa/tidebreak/**', '.github/workflows/shore-landscape-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix qa/browser
      # Chromium from Playwright's own host, cached by the lockfile. Not --with-deps in one step: on 2026-11-11 the
      # runner's Ubuntu mirror stopped resolving and that apt step ran until the job was cancelled (see arcade-voting.yml).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/browser/package-lock.json') }}
      - run: cd qa/browser && npx playwright install chromium
        timeout-minutes: 4
      # Fonts and system libraries through apt, best effort: when the mirror does not resolve, this gives up after
      # 3 minutes instead of hanging the job, and the tests run with the fonts the runner image already has.
      - run: cd qa/browser && npx playwright install-deps chromium
        timeout-minutes: 3
        continue-on-error: true
      - name: Verify large relief, cave geometry and exact surface queries
        run: node qa/tidebreak/terrain.test.mjs && node qa/tidebreak/geology.test.mjs && node qa/tidebreak/surface.test.mjs && node qa/tidebreak/terrain-effects.test.mjs
      - name: Render cliffs, caves and woods and verify controls at two viewport sizes
        run: node qa/tidebreak/landscape.e2e.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/qa/browser/node_modules
          SHOTS: ${{ github.workspace }}/test-results/shore-landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shore-landscape-desktop-portrait
          path: test-results/shore-landscape
          retention-days: 14

  camera:
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, portrait, landscape, small-phone]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix qa/browser
      # Chromium from Playwright's own host, cached by the lockfile. Not --with-deps in one step: on 2026-11-11 the
      # runner's Ubuntu mirror stopped resolving and that apt step ran until the job was cancelled (see arcade-voting.yml).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/browser/package-lock.json') }}
      - run: cd qa/browser && npx playwright install chromium
        timeout-minutes: 4
      # Fonts and system libraries through apt, best effort: when the mirror does not resolve, this gives up after
      # 3 minutes instead of hanging the job, and the tests run with the fonts the runner image already has.
      - run: cd qa/browser && npx playwright install-deps chromium
        timeout-minutes: 3
        continue-on-error: true
      - name: Verify wheel, pinch zoom and top-center Rift Jump in four layouts
        run: node qa/tidebreak/camera-zoom.test.mjs && node qa/tidebreak/pointers.test.mjs && node qa/tidebreak/camera-zoom.e2e.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/qa/browser/node_modules
          VIEWPORT: ${{ matrix.viewport }}
          SHOTS: ${{ github.workspace }}/test-results/shore-camera-zoom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shore-camera-zoom-${{ matrix.viewport }}
          path: test-results/shore-camera-zoom
          retention-days: 14
