name: Reel It In bundle for Google Play
# Builds a signed Android App Bundle of Reel It In with your upload key. Run it by hand: Actions, then this workflow, then Run workflow.
# Setup and the three secrets: play/fish/README.md. Running the workflow means that you accept the Android SDK license
# (https://developer.android.com/studio/terms) for the SDK packages that the build installs.
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Version note, shown in the run summary (for example "first internal test")'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check that the secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            printf '%s\n' 'Add the secrets PLAY_UPLOAD_KEYSTORE_BASE64 and PLAY_UPLOAD_KEYSTORE_PASSWORD (see play/fish/README.md).'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the files of the Android build
        run: node qa/fish/play.mjs
      - name: Write the upload keystore outside the workspace
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          KEYSTORE="$RUNNER_TEMP/reelitin-upload.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          printf 'BUBBLEWRAP_KEYSTORE=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build the bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          ACCEPT_ANDROID_SDK_LICENSES: 'yes'
          NOTE: ${{ inputs.note }}
        run: |
          play/fish/build-aab.sh --local --out "$RUNNER_TEMP/play-out"
          {
            printf '## Reel It In bundle\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            [ -z "$NOTE" ] || printf 'Note: %s\n\n' "$NOTE"
            printf 'Upload key SHA-256 (for `node play/fish/assetlinks.mjs --upload`):\n\n`%s`\n' "$(cat "$RUNNER_TEMP"/play-out/*.fingerprint.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reelitin-bundle
          path: |
            ${{ runner.temp }}/play-out/*.aab
            ${{ runner.temp }}/play-out/*.fingerprint.txt
          if-no-files-found: error
          retention-days: 7
      - name: Delete the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/reelitin-upload.keystore"
